services:
  - type: web
    name: signal-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: sh -c "uvicorn backend.app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: signal-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: signal-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ORG_NAME
        value: Client Workspace
      - key: APIFY_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: HUNTER_API_KEY
        sync: false
      - key: ZEROBOUNCE_API_KEY
        sync: false
      - key: EMAIL_VERIFY_PROVIDER
        value: hunter
      - key: HUBSPOT_CLIENT_ID
        sync: false
      - key: HUBSPOT_CLIENT_SECRET
        sync: false
      - key: HUBSPOT_REDIRECT_URI
        sync: false

  - type: worker
    name: signal-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: python backend/worker.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: signal-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: signal-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: signal-api
          type: web
          envVarKey: SECRET_KEY
      - key: APIFY_TOKEN
        fromService:
          name: signal-api
          type: web
          envVarKey: APIFY_TOKEN
      - key: GROQ_API_KEY
        fromService:
          name: signal-api
          type: web
          envVarKey: GROQ_API_KEY
      - key: HUNTER_API_KEY
        fromService:
          name: signal-api
          type: web
          envVarKey: HUNTER_API_KEY
      - key: ZEROBOUNCE_API_KEY
        fromService:
          name: signal-api
          type: web
          envVarKey: ZEROBOUNCE_API_KEY
      - key: EMAIL_VERIFY_PROVIDER
        fromService:
          name: signal-api
          type: web
          envVarKey: EMAIL_VERIFY_PROVIDER
      - key: HUBSPOT_CLIENT_ID
        fromService:
          name: signal-api
          type: web
          envVarKey: HUBSPOT_CLIENT_ID
      - key: HUBSPOT_CLIENT_SECRET
        fromService:
          name: signal-api
          type: web
          envVarKey: HUBSPOT_CLIENT_SECRET

  - type: web
    name: signal-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerCommand: node server.js
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false

  - type: redis
    name: signal-redis
    plan: starter
    ipAllowList: []

databases:
  - name: signal-db
    plan: starter
